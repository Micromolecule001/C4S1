<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Ollama Frontend</title>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <div class="container">
    <h1>💬 Локальна LLM через Ollama</h1>
    <textarea id="prompt" placeholder="Введіть запит..."></textarea>
    <button id="send">Надіслати</button>
    <pre id="response"></pre>
  </div>

  <script>
    document.getElementById("send").onclick = async () => {
      const prompt = document.getElementById("prompt").value;
      const respDiv = document.getElementById("response");
      respDiv.textContent = "Зачекайте...";
      const res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({prompt})
      });
      const data = await res.json();
      respDiv.textContent = data.answer;
    };
  </script>
</body>
</html>
